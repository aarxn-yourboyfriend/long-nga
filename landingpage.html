<!DOCTYPE html>
<html lang="vi" class="lock">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5EFE6">
<title>Thiệp cưới</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Be+Vietnam+Pro:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F5EFE6;--ink:#2A2521;--muted:#6F655B;--line:#D8CDBD;--clay:#B8654E;--paper:#E4DACB}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:#EAE2D5;color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:300;line-height:1.75}
p,h2,figure{margin:0}
.serif{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:400}
.lab{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:400}
.page{max-width:480px;margin:0 auto;background:var(--ivory);overflow:hidden;min-height:100vh}

/* cover */
#cover{position:fixed;inset:0;z-index:50;background:var(--ivory);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;cursor:pointer;transition:transform 1.1s cubic-bezier(.77,0,.18,1);outline:none}
#cover:before{content:'';position:absolute;inset:14px;border:1px solid var(--line);pointer-events:none}
#cover.gone{transform:translateY(-100%)}
#cin{opacity:0;transition:opacity .6s}
#cover.ready #cin{opacity:1}
.ld{position:absolute;color:var(--muted);letter-spacing:.4em;animation:blink 1.4s ease-in-out infinite}
#cover.ready .ld{display:none}
.cn{display:flex;flex-wrap:wrap;justify-content:center;line-height:1.15;margin:10px 0 0}
.cl{width:40px;height:1px;background:var(--clay);margin:26px auto 0}
.ctap{margin-top:30px;opacity:0}
#cover.ready .ctap{animation:blink 2.4s ease-in-out 2.4s infinite}

/* letters */
.ltr{display:inline-block;opacity:0}
#cover.ready .ltr,.anim .ltr{animation:rise .9s cubic-bezier(.2,.7,.2,1) var(--d) both}

/* reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.ph{position:relative;overflow:hidden;background:var(--paper);width:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .9s ease,transform 1.8s cubic-bezier(.2,.7,.2,1)}
.ph.has img{opacity:1}
.in .ph.has img,.ph.in.has img{transform:none}

/* hero */
.hero{position:relative}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 22px 26px;color:var(--ink);transition:background .6s}
.hero.has .ov{background:rgba(20,16,12,.28);color:var(--ivory)}
.ov .lab{color:inherit;display:flex;justify-content:space-between;margin-bottom:auto}
.hn{font-size:min(23vw,108px);line-height:.86;letter-spacing:-.02em;opacity:0}
.hn.r{text-align:right}
.opened .hn{animation:rise 1.3s cubic-bezier(.2,.7,.2,1) .5s both}
.opened .hn.r{animation-delay:.9s}

/* guest */
.gs{padding:60px 24px 52px;text-align:center}
.fade{opacity:0}
.anim .fade{animation:rise .9s ease-out var(--d) both}
.tt{font-size:26px;color:var(--clay);line-height:1.2;margin-top:6px}
.gname{line-height:1.1;display:flex;flex-wrap:wrap;justify-content:center;margin-top:4px;min-height:1.1em}
.ul{display:block;margin:10px auto 0;width:200px;height:10px}
.ul path{stroke-dasharray:220;stroke-dashoffset:220}
.anim .ul path{animation:draw 1s ease-out 1s both}
.inv{font-size:15px;color:#3D3631;margin-top:20px;padding:0 6px}
.rowd{display:flex;margin:28px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rowd>div{flex:1;padding:14px 0}
.rowd>div+div{border-left:1px solid var(--line)}
.rowd b{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:32px;line-height:1.2}
.note{margin-top:16px;font-size:13px;color:var(--muted)}

/* story */
.intro{padding:0 34px;text-align:center}
.intro p{font-size:25px;line-height:1.4}
.chh{display:flex;justify-content:space-between;padding:56px 20px 12px}
.h2{font-size:42px;line-height:1.02;margin:0 20px 18px}
.body{padding:0 20px;font-size:15px;color:#3D3631}
.body p+p{margin-top:14px}
.cap{padding:8px 20px 0;text-transform:none;letter-spacing:.04em}
.two{display:flex;gap:10px;padding:0 20px;align-items:flex-start}
.qv{position:relative;margin-top:60px}
.qv .ph{background:var(--ink)}
.qv .ov{align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--ivory)}
.qv.has .ov{background:rgba(20,16,12,.45)}
.qv .serif{font-size:30px;line-height:1.3}
.qv .ln{width:40px;height:1px;background:#D9937C;margin:22px auto 0}

/* album */
.gal{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:56px;gap:8px;margin:0 20px}
.gal .ph{height:100%}
.gal .ph.has{cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:40;background:rgba(20,16,12,.94);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lb.on{display:flex}
#lbi{max-width:100%;max-height:100%;object-fit:contain}

/* day */
.sch{margin:0 20px}
.sch div{display:flex;gap:18px;padding:13px 0;border-bottom:1px solid var(--line);align-items:baseline}
.sch div:last-child{border-bottom:0}
.sch b{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:26px;width:64px;flex:none;color:var(--clay)}
.lk{display:inline-block;margin:18px 20px 0;font-size:13px;color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:2px;text-decoration:none;font-weight:400}
.end{text-align:center;padding:72px 20px 56px}
.mono{font-size:56px;line-height:1}
.mono .amp{color:var(--clay)}

@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:220}to{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
.rv{opacity:1;transform:none;transition:none}
.ltr,.fade,.hn{opacity:1;animation:none!important}
.ul path{stroke-dashoffset:0;animation:none!important}
.ph img{transform:none;transition:opacity .3s}
#cover{transition:none}
}
</style>
</head>
<body>

<div id="cover" role="button" tabindex="0" aria-label="Mở thiệp">
  <div class="ld" id="ld">···</div>
  <div id="cin">
    <p class="lab">Thiệp mời dành riêng cho</p>
    <div class="serif cn" id="cname"></div>
    <div class="cl"></div>
    <p class="ctap lab">Chạm để mở thiệp</p>
  </div>
</div>

<main class="page" id="page">

  <section class="hero" id="hero">
    <div class="ph" style="aspect-ratio:3/4.4"><img data-img="img_cover" alt=""></div>
    <div class="ov">
      <div class="lab"><span id="ini"></span><span data-t="date_short"></span></div>
      <div class="hn serif" id="hn1"></div>
      <div class="hn serif r" id="hn2"></div>
    </div>
  </section>

  <section class="gs" id="gs">
    <p class="lab fade" style="--d:.1s">Thiệp mời dành riêng cho</p>
    <div class="tt serif fade" id="gt" style="--d:.2s"></div>
    <div class="gname serif" id="gn"></div>
    <svg class="ul" viewBox="0 0 200 10" aria-hidden="true"><path d="M4 6C50 1 100 9 196 3" fill="none" stroke="#B8654E" stroke-width="1.2" stroke-linecap="round"/></svg>
    <p class="inv fade" style="--d:1.4s" data-t="invite_line"></p>
    <div class="rowd fade" style="--d:1.6s">
      <div><span class="lab">Ngày</span><b data-t="date_day"></b></div>
      <div><span class="lab">Giờ</span><b data-t="time"></b></div>
      <div id="tbc"><span class="lab">Bàn</span><b id="tn"></b></div>
    </div>
    <p class="note fade" id="seat" style="--d:1.8s"></p>
  </section>

  <div class="intro rv"><p class="serif" data-t="intro"></p></div>

  <div class="chh rv"><span class="lab" data-t="ch1_label"></span><span class="lab" data-t="ch1_place"></span></div>
  <h2 class="h2 serif rv" data-t="ch1_title"></h2>
  <div class="body rv" data-p="ch1_text"></div>
  <figure class="ph rv" style="aspect-ratio:4/3;margin-top:24px"><img data-img="img_ch1" alt="" loading="lazy"></figure>
  <p class="cap lab rv" data-t="ch1_caption"></p>

  <div class="chh rv"><span class="lab" data-t="ch2_label"></span><span class="lab" data-t="ch2_place"></span></div>
  <h2 class="h2 serif rv" data-t="ch2_title"></h2>
  <div class="two rv">
    <figure class="ph" style="aspect-ratio:3/4;width:62%;flex:none"><img data-img="img_ch2a" alt="" loading="lazy"></figure>
    <figure class="ph" style="aspect-ratio:1/1;margin-top:64px"><img data-img="img_ch2b" alt="" loading="lazy"></figure>
  </div>
  <div class="body rv" style="margin-top:24px" data-p="ch2_text"></div>

  <div class="chh rv"><span class="lab" data-t="ch3_label"></span><span class="lab" data-t="ch3_place"></span></div>
  <h2 class="h2 serif rv" data-t="ch3_title"></h2>
  <figure class="ph rv" style="aspect-ratio:4/5"><img data-img="img_ch3" alt="" loading="lazy"></figure>
  <div class="body rv" style="margin-top:24px" data-p="ch3_text"></div>

  <section class="qv rv">
    <div class="ph" style="aspect-ratio:1/1"><img data-img="img_quote" alt="" loading="lazy"></div>
    <div class="ov"><div><div class="serif" data-t="quote"></div><div class="ln"></div></div></div>
  </section>

  <div class="chh rv"><span class="lab" data-t="album_label"></span><span class="lab">Chạm để xem lớn</span></div>
  <div class="gal rv">
    <figure class="ph" style="grid-row:span 4"><img data-img="img_a1" alt="" loading="lazy"></figure>
    <figure class="ph" style="grid-row:span 3"><img data-img="img_a2" alt="" loading="lazy"></figure>
    <figure class="ph" style="grid-row:span 3"><img data-img="img_a3" alt="" loading="lazy"></figure>
    <figure class="ph" style="grid-row:span 4"><img data-img="img_a4" alt="" loading="lazy"></figure>
    <figure class="ph" style="grid-column:span 2;grid-row:span 3"><img data-img="img_a5" alt="" loading="lazy"></figure>
  </div>

  <div class="chh rv"><span class="lab" data-t="day_label"></span><span class="lab" data-t="weekday"></span></div>
  <h2 class="h2 serif rv" style="margin-bottom:10px" data-t="date_long"></h2>
  <div class="sch rv" id="sch"></div>
  <p class="body rv" style="margin-top:14px"><span data-t="venue"></span> · <span data-t="address"></span></p>
  <a class="lk rv" id="map" target="_blank" rel="noopener">Chỉ đường trên Google Maps</a>

  <div class="end rv">
    <div class="serif mono"><span id="m1"></span><span class="amp">&amp;</span><span id="m2"></span></div>
    <p class="lab" style="margin-top:14px" data-t="footer_line"></p>
  </div>
</main>

<div id="lb"><img id="lbi" alt=""></div>

<script>
(function(){
'use strict';

/* Dán địa chỉ Apps Script (.../exec) vào đây để đọc từ Google Sheet.
   Để trống thì trang dùng nội dung mẫu bên dưới. */
var API='';

var SAMPLE={
groom:'Long',bride:'Nga',
date_short:'20 . 12 . 2026',date_day:'20.12',time:'11:00',
date_long:'20 tháng 12, 2026',weekday:'Thứ Bảy',
venue:'Sảnh Rosé',address:'12 Nguyễn Huệ, Quận 1, TP. Hồ Chí Minh',
map_url:'https://www.google.com/maps/search/?api=1&query=12+Nguyen+Hue+Quan+1+TP+Ho+Chi+Minh',
invite_line:'đến chung vui trong ngày chúng mình về chung một nhà.',
intro:'Chuyện của hai người bắt đầu từ một cơn mưa, và chưa bao giờ thật sự tạnh.',
ch1_label:'Chương I',ch1_place:'Sài Gòn · 2019',ch1_title:'Cơn mưa chiều',
ch1_text:'Nga vào quán chỉ để trú mưa. Chiếc bàn cuối cùng còn trống có một người đàn ông đang ngồi với cây dù gãy gọng, và anh dời cuốn sách sang một bên mà không cần ai hỏi.',
ch1_caption:'Quán cà phê ngày mưa, 2019',
ch2_label:'Chương II',ch2_place:'Đà Lạt · 2022',ch2_title:'Đồi thông, và những lần lạc',
ch2_text:'Chuyến xe sáu giờ bốn mươi sáng. Hai người mang theo một tấm bản đồ giấy và không ai chịu mở nó ra. Họ lạc ba lần, ăn bánh tráng nướng ở một ngã tư không có tên.||Long nói điều anh đã tập suốt dọc đường. Nga bảo, em biết rồi, từ lần lạc thứ hai.',
ch3_label:'Chương III',ch3_place:'Hội An · 2025',ch3_title:'Đêm rằm, trên sông Hoài',
ch3_text:'Chiếc nhẫn nằm trong túi áo suốt hai ngày, và Long đã đổi chỗ giấu nó sáu lần. Giữa phố đèn lồng, anh quỳ xuống, vì chân run chứ không phải vì lãng mạn. Nga cười trước, khóc sau, rồi mới nói đồng ý.',
quote:'Không ai nhớ chính xác ai nói trước. Chỉ nhớ là trời đã tạnh.',
album_label:'Album',day_label:'Ngày hôm đó',
sch1_time:'10:00',sch1_text:'Đón khách',
sch2_time:'11:00',sch2_text:'Lễ thành hôn',
sch3_time:'12:00',sch3_text:'Tiệc trưa',
sch4_time:'15:00',sch4_text:'Chụp ảnh cùng gia đình',
footer_line:'Cảm ơn vì đã ở đây'
};

function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}

var q=new URLSearchParams(location.search).get('g');
var seg=location.pathname.replace(/^\/+|\/+$/g,'');
var code=q||(/\.html?$/.test(seg)?'':seg);

function nameFromCode(c){
  if(!c)return null;
  var s=c.replace(/-[a-z0-9]{4}$/,'').replace(/-/g,' ').trim();
  if(!s)return null;
  s=s.replace(/(^|\s)\S/g,function(m){return m.toUpperCase()});
  return {title:'Bạn',name:s,people:1,table:''};
}

function load(){
  function fallback(){return {content:SAMPLE,guest:nameFromCode(code)}}
  if(!API)return Promise.resolve(fallback());
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},9000);
  return fetch(API+'?g='+encodeURIComponent(code),{signal:ctl.signal})
    .then(function(r){return r.json()})
    .then(function(j){
      clearTimeout(tm);
      var c={},k;
      for(k in SAMPLE)c[k]=SAMPLE[k];
      var src=(j&&j.content)||{};
      for(k in src){if(src[k]!==''&&src[k]!=null)c[k]=String(src[k])}
      return {content:c,guest:(j&&j.guest)||null};
    })
    .catch(function(){clearTimeout(tm);return fallback()});
}

var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){
  es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}});
},{threshold:.12}):null;
function watch(el){if(io)io.observe(el);else el.classList.add('in')}

function letters(el,name,base,step){
  el.textContent='';
  Array.from(name).forEach(function(ch,i){
    var s=document.createElement('span');
    if(ch===' '){s.style.display='inline-block';s.style.width='.28em'}
    else{s.className='ltr';s.style.setProperty('--d',(base+i*step).toFixed(2)+'s');s.textContent=ch}
    el.appendChild(s);
  });
}

function render(d){
  var c=d.content,g=d.guest||{title:'',name:'Bạn thân mến',people:1,table:''};
  document.title=c.groom+' & '+c.bride;

  $$('[data-t]').forEach(function(el){el.textContent=c[el.getAttribute('data-t')]||''});
  $$('[data-p]').forEach(function(el){
    el.textContent='';
    String(c[el.getAttribute('data-p')]||'').split(/\n+|\|\|/).forEach(function(s){
      s=s.trim();
      if(s){var p=document.createElement('p');p.textContent=s;el.appendChild(p)}
    });
  });

  var i1=Array.from(c.groom)[0]||'',i2=Array.from(c.bride)[0]||'';
  $('#ini').textContent=i1+' & '+i2;
  $('#m1').textContent=i1;$('#m2').textContent=i2;
  $('#hn1').textContent=c.groom;
  $('#hn2').textContent='& '+c.bride;

  var n=String(g.name||'').trim(),len=Array.from(n).length;
  letters($('#cname'),n,.3,.07);
  $('#cname').style.fontSize=len>14?'36px':len>10?'46px':'56px';
  letters($('#gn'),n,.4,.06);
  $('#gn').style.fontSize=len>14?'40px':len>10?'52px':'64px';
  $('#gt').textContent=g.title||'';
  var tb=String(g.table||'').trim();
  $('#tbc').style.display=tb?'block':'none';
  $('#tn').textContent=tb.length===1?'0'+tb:tb;
  var pp=parseInt(g.people,10)||1;
  $('#seat').textContent=pp===1?'Chúng mình đã giữ một chỗ cho bạn.':'Chúng mình đã giữ chỗ cho '+pp+' người.';

  var sc=$('#sch');sc.textContent='';
  for(var i=1;i<=8;i++){
    var tm=c['sch'+i+'_time'],tx=c['sch'+i+'_text'];
    if(tm&&tx){
      var row=document.createElement('div'),b=document.createElement('b'),s=document.createElement('span');
      b.textContent=tm;s.textContent=tx;row.appendChild(b);row.appendChild(s);sc.appendChild(row);
    }
  }

  var map=$('#map');
  if(c.map_url)map.href=c.map_url;else map.style.display='none';

  $$('[data-img]').forEach(function(img){
    var u=c[img.getAttribute('data-img')];
    if(!u)return;
    img.referrerPolicy='no-referrer';
    img.onload=function(){
      var box=img.closest('.ph');if(box)box.classList.add('has');
      var h=img.closest('.hero,.qv');if(h)h.classList.add('has');
    };
    img.onerror=function(){img.removeAttribute('src')};
    img.src=u;
  });
}

var cover=$('#cover'),ready=false,opened=false;
function open(){
  if(!ready||opened)return;
  opened=true;
  document.body.classList.add('opened');
  cover.classList.add('gone');
  setTimeout(function(){document.documentElement.classList.remove('lock');cover.style.display='none'},1200);
}
cover.addEventListener('click',open);
cover.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});

var lb=$('#lb');
$$('.gal .ph').forEach(function(f){
  f.addEventListener('click',function(){
    if(!f.classList.contains('has'))return;
    $('#lbi').src=$('img',f).src;lb.classList.add('on');
  });
});
lb.addEventListener('click',function(){lb.classList.remove('on')});

load().then(function(d){
  render(d);
  $$('.rv').forEach(watch);
  var gs=$('#gs');
  if('IntersectionObserver' in window){
    var go=new IntersectionObserver(function(es){
      es.forEach(function(e){if(e.isIntersecting){gs.classList.add('anim');go.disconnect()}});
    },{threshold:.35});
    go.observe(gs);
  }else gs.classList.add('anim');
  cover.classList.add('ready');
  ready=true;
});
})();
</script>
</body>
</html>
